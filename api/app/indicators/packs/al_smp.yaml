# SMP 2024 Annex A — "Lista e miratuar e treguesve të SMP 2024" (52 indicators).
#
# This is a COVERAGE pack, not a computed pack: it states, for each national indicator, how
# Sportel could reach it today. Names are verbatim from Annex A (Albanian). The mapping is a
# draft pending the organisers' approval ("approval: pending").
#
# base_state:
#   computable → mapped to a core_kpi passport (reported "computable" only while that passport
#                is computable; otherwise "missing" with the owner of the missing export)
#   document   → a publication / plan-exists check, not computed from exports
#   national   → computed nationally by AMVV from Ministry of Finance data
#   manual     → a count kept in a register by the responsible unit
#   missing    → needs sector data nobody has exported to Sportel yet
# owner: a catalog owner key (app.catalog.OWNERS) or a key of `owners` below (role-based
#        placeholders; replace with the units confirmed at the municipal desk).
pack: al_smp
version: "0.1.0"
source: "SMP 2024, Aneksi A — Lista e miratuar e treguesve të SMP 2024"
label:
  sq: "SMP 2024 — Aneksi A: 52 treguesit kombëtarë"
  en: "SMP 2024 — Annex A: the 52 national indicators"
approval: pending

owners:
  education:
    sq: "Struktura përgjegjëse për arsimin parauniversitar"
    en: "Unit responsible for pre-university education"
  agriculture:
    sq: "Struktura përgjegjëse për bujqësinë dhe ujitjen"
    en: "Unit responsible for agriculture and irrigation"
  forests:
    sq: "Struktura përgjegjëse për pyjet dhe kullotat"
    en: "Unit responsible for forests and pastures"
  fire:
    sq: "Shërbimi i Mbrojtjes nga Zjarri dhe i Shpëtimit"
    en: "Fire Protection and Rescue Service"
  social:
    sq: "Struktura përgjegjëse për shërbimet sociale"
    en: "Unit responsible for social services"
  housing:
    sq: "Struktura përgjegjëse për strehimin social"
    en: "Unit responsible for social housing"
  council:
    sq: "Sekretaria e Këshillit Bashkiak"
    en: "Municipal Council secretariat"
  consultation:
    sq: "Koordinatori për njoftimin dhe konsultimin publik"
    en: "Public notification and consultation coordinator"
  integrity:
    sq: "Koordinatori për integritetin"
    en: "Integrity coordinator"
  european:
    sq: "Struktura përgjegjëse për integrimin evropian dhe projektet"
    en: "Unit responsible for European integration and projects"
  diaspora:
    sq: "Struktura përgjegjëse për migracionin dhe diasporën"
    en: "Unit responsible for migration and diaspora"
  gender:
    sq: "Punonjësi për barazinë gjinore"
    en: "Gender equality officer"

notes:
  document:
    sq: "Kontroll dokumenti: a është miratuar ose publikuar? Nuk llogaritet nga eksportet."
    en: "Document check: has it been approved or published? Not computed from exports."
  national:
    sq: "Burimi: Ministria e Financave, llogaritur nga AMVV"
    en: "Source: Ministry of Finance, computed by AMVV"
  manual:
    sq: "Vlerë manuale: numërohet nga regjistri i strukturës përgjegjëse, jo nga një eksport."
    en: "Manual value: counted from the responsible unit's register, not from an export."
  missing:
    sq: "Kërkon të dhëna sektoriale nga struktura përgjegjëse."
    en: "Needs sector data from the responsible unit."

areas:
  - key: education
    name: {sq: "Arsimi", en: "Education"}
    items:
      - number: 1
        name_sq: "Shkalla e regjistrimit në çerdhe"
        base_state: missing
        owner: education
        note:
          sq: "Kërkon regjistrimet në çerdhe dhe numrin e fëmijëve në moshë (vetëm agregate)."
          en: "Needs nursery enrolments and the number of children of that age (aggregates only)."
      - number: 2
        name_sq: "Shkalla e regjistrimit në kopshte publike dhe private"
        base_state: missing
        owner: education
        note:
          sq: "Kërkon regjistrimet në kopshte publike dhe private dhe popullsinë në moshë."
          en: "Needs public and private kindergarten enrolments and the population of that age."
      - number: 3
        name_sq: "Numri i infrastrukturës arsimore parauniversitare sipas nivelit arsimor"
        base_state: missing
        owner: education
        note:
          sq: "Kërkon regjistrin e objekteve arsimore sipas nivelit."
          en: "Needs the register of education buildings by level."
      - number: 4
        name_sq: "Raporti fëmijë-mësues në kopshte publike dhe private"
        base_state: missing
        owner: education
      - number: 5
        name_sq: "Plan Vendor të Arsimit Parauniversitar"
        base_state: document
        owner: education

  - key: agriculture
    name: {sq: "Bujqësia", en: "Agriculture"}
    items:
