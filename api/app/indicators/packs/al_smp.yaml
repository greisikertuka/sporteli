        name_sq: "Tokë bujqësore e pajisur me kanale ujitje/kullimi"
        base_state: missing
        owner: agriculture
      - number: 7
        name_sq: "Përqindja e kanaleve funksionale të ujitjes dhe kullimit"
        base_state: missing
        owner: agriculture

  - key: forests
    name: {sq: "Pyje dhe kullota", en: "Forests and pastures"}
    items:
      - number: 8
        name_sq: "Shkalla e pajisjes me plane mbarështimi"
        base_state: missing
        owner: forests
      - number: 9
        name_sq: "Punonjës për 1'000 hektarë"
        base_state: missing
        owner: forests
        note:
          sq: "Kërkon sipërfaqen e pyjeve dhe kullotave (ha) dhe punonjësit e shërbimit pyjor."
          en: "Needs the forest and pasture area (ha) and the forestry service staff."

  - key: fire
    name: {sq: "Mbrojtja nga zjarri", en: "Fire protection"}
    items:
