        name_sq: "Zjarrëfikës për 1'500 banorë"
        base_state: missing
        owner: fire
        note:
          sq: "Emëruesi (popullsia) vjen nga tabela e popullsisë; mungon numri i zjarrfikësve."
          en: "The denominator (population) comes from the population table; the number of firefighters is missing."
      - number: 11
        name_sq: "Automjete zjarrëfikëse për 10'000 banorë"
        base_state: missing
        owner: fire
        note:
          sq: "Emëruesi (popullsia) vjen nga tabela e popullsisë; mungon numri i automjeteve."
