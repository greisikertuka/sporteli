  - key: waste
    name: {sq: "Menaxhimi i mbetjeve", en: "Waste management"}
    items:
      - number: 12
        name_sq: "Mbulimi i popullsisë me shërbimin e menaxhimit të mbetjeve në zonat urbane/rurale"
        base_state: missing
        owner: public_services
        note:
          sq: "Eksporti i mbetjeve ka kolonën «Familje të mbuluara»; mungon numri total i familjeve sipas njësisë administrative."
          en: "The waste export has a “Households served” column; the total number of households per administrative unit is missing."
      - number: 13
        name_sq: "Mbulimi kostos së menaxhimit të mbetjeve nga tarifa e shërbimit"
        base_state: computable
        passport_code: REV-02
        note:
          sq: "Llogaritet nga pasaporta REV-02: tarifa e pastrimit e arkëtuar ÷ shpenzimet e programit 05100."
          en: "Computed by passport REV-02: cleaning fee collected ÷ spending of programme 05100."
      - number: 14
        name_sq: "Mbetjet e gjeneruara si kg/banorë"
        base_state: computable
        passport_code: WST-02
        note:
          sq: "Llogaritet nga pasaporta WST-02 (mbetjet e grumbulluara si përafrim i të gjeneruarave), me bazën e zgjedhur të popullsisë."
          en: "Computed by passport WST-02 (waste collected as a proxy for waste generated), on the pinned population basis."
      - number: 15
        name_sq: "Kosto për ton/lekë"
        base_state: computable
        passport_code: WST-03
        note:
          sq: "Llogaritet nga pasaporta WST-03: shpenzimet e programit 05100 ÷ tonët e grumbulluar."
          en: "Computed by passport WST-03: spending of programme 05100 ÷ tonnes collected."
      - number: 16
        name_sq: "Plan Vendor të Menaxhimit të Mbetjeve"
        base_state: document
        owner: public_services

  - key: social
